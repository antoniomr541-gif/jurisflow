<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cliente | PedidoFlow</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#f3f4f6;border-radius:14px;padding:4px;margin:18px 0}
.auth-tabs button{border:0;padding:11px;border-radius:11px;font-weight:800;background:transparent}
.auth-tabs button.active{background:#111827;color:#fff}
.signup-only{display:block}
.login-mode .signup-only{display:none}
.address-grid{display:grid;grid-template-columns:1fr 110px;gap:10px}
@media(max-width:520px){.address-grid{grid-template-columns:1fr}}
</style>
</head>
<body class="auth-body">
<div class="auth-card" id="authCard">
  <div class="logo">🍔</div>
  <h1>Área do cliente</h1>
  <p class="muted">Na primeira compra, crie seu cadastro. Depois, seus dados ficam preenchidos automaticamente.</p>

  <div class="auth-tabs">
    <button id="signupTab" class="active" onclick="setMode('signup')">Criar conta</button>
    <button id="loginTab" onclick="setMode('login')">Já tenho conta</button>
  </div>

  <div class="signup-only">
    <input id="nameInput" placeholder="Nome completo">
  </div>
  <input id="phoneInput" inputmode="numeric" placeholder="Celular com DDD">
  <input id="passwordInput" type="password" placeholder="Senha (mínimo 6 caracteres)">

  <div class="signup-only">
    <div class="address-grid">
      <input id="addressInput" placeholder="Rua ou avenida">
      <input id="numberInput" inputmode="numeric" placeholder="Número">
    </div>
    <input id="neighborhoodInput" placeholder="Bairro">
    <input id="cityInput" placeholder="Cidade" value="Jequié">
    <input id="referenceInput" placeholder="Ponto de referência (opcional)">
    <label style="display:flex;gap:8px;align-items:flex-start;margin:8px 0 12px;font-size:13px">
      <input id="marketingConsent" type="checkbox" style="width:auto;margin:2px 0 0">
      <span>Autorizo receber promoções pelo WhatsApp.</span>
    </label>
  </div>

  <button id="mainButton" class="btn btn-primary" onclick="submitAuth()">Criar conta e continuar</button>
  <div id="messageElement" class="message"></div>
  <p style="text-align:center"><a href="index.html">Voltar ao cardápio</a></p>
</div>

<script>
const db=supabase.createClient('https://ggdmqffnkpumjwmrqqzi.supabase.co','sb_publishable_FKN_oKLr3Ud0C5p6Sw77Uw_1P8w1hhc');
let mode='signup';
const digits=v=>String(v||'').replace(/\D/g,'');
const syntheticEmail=p=>`cliente_${digits(p)}@pedidoflow.com`;

function setMode(next){
  mode=next;
  authCard.classList.toggle('login-mode',mode==='login');
  signupTab.classList.toggle('active',mode==='signup');
  loginTab.classList.toggle('active',mode==='login');
  mainButton.textContent=mode==='signup'?'Criar conta e continuar':'Entrar e continuar';
  messageElement.textContent='';
}

function show(text,ok=false){
  messageElement.textContent=text;
  messageElement.style.color=ok?'#15803d':'#b91c1c';
}

async function submitAuth(){
  if(mode==='signup') return signUp();
  return signIn();
}

async function signUp(){
  const nome=nameInput.value.trim();
  const phone=digits(phoneInput.value);
  const password=passwordInput.value;
  const endereco=addressInput.value.trim();
  const numero=digits(numberInput.value);
  const bairro=neighborhoodInput.value.trim();
  const cidade=cityInput.value.trim();

  if(nome.length<3)return show('Informe seu nome completo.');
  if(phone.length<10||phone.length>11)return show('Informe um celular válido com DDD.');
  if(password.length<6)return show('A senha precisa ter pelo menos 6 caracteres.');
  if(endereco.length<4)return show('Informe a rua ou avenida.');
  if(!numero)return show('Informe o número do endereço.');
  if(bairro.length<2)return show('Informe o bairro.');
  if(cidade.length<2)return show('Informe a cidade.');

  show('Criando cadastro...',true);

  const {data,error}=await db.auth.signUp({
    email:syntheticEmail(phone),
    password,
    options:{data:{nome,whatsapp:phone}}
  });

  if(error){
    if(String(error.message).toLowerCase().includes('already registered')){
      setMode('login');
      return show('Esse celular já possui conta. Digite a senha para entrar.');
    }
    return show(error.message);
  }

  if(!data.session)return show('No Supabase, desative a opção Confirm email.');

  const {error:profileError}=await db.from('perfis').upsert({
    id:data.user.id,
    nome,
    whatsapp:phone,
    endereco,
    numero,
    bairro,
    cidade,
    referencia:referenceInput.value.trim(),
    aceita_promocoes:marketingConsent.checked,
    consentimento_em:marketingConsent.checked?new Date().toISOString():null,
    role:'cliente'
  },{onConflict:'id'});

  if(profileError)return show('Conta criada, mas não foi possível salvar os dados: '+profileError.message);
  continueToOrder();
}

async function signIn(){
  const phone=digits(phoneInput.value);
  const password=passwordInput.value;
  if(phone.length<10||phone.length>11)return show('Informe seu celular com DDD.');
  if(!password)return show('Informe sua senha.');

  show('Entrando...',true);
  const {data,error}=await db.auth.signInWithPassword({
    email:syntheticEmail(phone),
    password
  });
  if(error)return show('Celular ou senha inválidos.');

  const {data:profile}=await db.from('perfis').select('role').eq('id',data.user.id).single();
  if(profile?.role==='dono'){
    await db.auth.signOut();
    return show('Use o acesso exclusivo do dono.');
  }
  continueToOrder();
}

function continueToOrder(){
  const target=sessionStorage.getItem('pf_return_after_login')||'index.html';
  sessionStorage.removeItem('pf_return_after_login');
  location.href=target;
}

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(session) continueToOrder();
})();
</script>
</body>
</html>
